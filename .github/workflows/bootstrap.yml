name: Bootstrap Kvisl source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/kvisl-site.zip'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: |
          rm -rf .bootstrap-work
          mkdir .bootstrap-work
          unzip -q .bootstrap/kvisl-site.zip -d .bootstrap-work
          cp -a .bootstrap-work/kvisl-site/. .
          rm -rf .bootstrap .bootstrap-work .github/workflows/bootstrap.yml
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Kvisl Astro magazine"
            git push
          fi
