name: Bootstrap Kvisl source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and unpack source
        run: |
          rm -rf .bootstrap-work
          mkdir -p .bootstrap-work/unpacked
          cat .bootstrap/slim-* | base64 -d > .bootstrap-work/kvisl-site.zip
          unzip -q .bootstrap-work/kvisl-site.zip -d .bootstrap-work/unpacked
          rsync -a --exclude='.github' .bootstrap-work/unpacked/kvisl-site/ ./
          rm -rf .bootstrap .bootstrap-work
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Kvisl Astro magazine"
            git push
          fi
