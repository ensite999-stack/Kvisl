name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Audit dependencies
        run: npm audit --json || true

      - name: Show outdated packages
        run: npm outdated || true

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://kvisl.com
        run: npm run build
