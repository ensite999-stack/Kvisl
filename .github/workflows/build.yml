name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fix CSS compatibility warnings
        run: |
          sed -i 's/align-items: end;/align-items: flex-end;/g' app/globals.css

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://kvisl.com
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Persist lockfile and CSS fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json app/globals.css
          if ! git diff --cached --quiet; then
            git commit -m "Lock secure dependencies and fix CSS warnings"
            git push
          fi
